<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
<rect width="900" height="470" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827" >CI 流水线如何把关 merge request（第 1 轮通过，第 2 轮测试失败）</text>
<rect x="20" y="150" width="130" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"></rect><text x="85.0" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#111827" >开发者</text><text x="85.0" y="194" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280" >feature 分支 push</text>
<rect x="190" y="150" width="130" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"></rect><text x="255.0" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="#111827" >Merge Request</text><text x="255.0" y="194" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280" >!12 → main</text>
<rect x="360" y="105" width="250" height="160" rx="10" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.5"/>
<text x="485" y="125" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8" >Pipeline（.gitlab-ci.yml）</text>
<rect x="375" y="140" width="105" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"><animate attributeName="fill" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05;0.125;0.5;0.55;0.625;0.85;0.9" values="#f3f4f6;#fef9c3;#dcfce7;#f3f4f6;#fef9c3;#dcfce7;#fef9c3;#dcfce7"/></rect><text x="427" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#111827" >lint</text><text x="427" y="176" text-anchor="middle" font-size="10" font-weight="400" fill="#374151" font-family="Menlo, Consolas, monospace">make lint</text><text x="427" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" opacity="0">等待<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05;0.5;0.55" values="1;0;1;0"/></text><text x="427" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207" opacity="0">⏳ 运行中<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05;0.125;0.55;0.625;0.85;0.9" values="0;1;0;1;0;1;0"/></text><text x="427" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" opacity="0">✓ passed<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.5;0.625;0.85;0.9" values="0;1;0;1;0;1"/></text>
<rect x="490" y="140" width="105" height="70" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"><animate attributeName="fill" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.2;0.5;0.625;0.7;0.9;0.95" values="#f3f4f6;#fef9c3;#dcfce7;#f3f4f6;#fef9c3;#fee2e2;#fef9c3;#dcfce7"/></rect><text x="542" y="160" text-anchor="middle" font-size="13" font-weight="700" fill="#111827" >test</text><text x="542" y="176" text-anchor="middle" font-size="10" font-weight="400" fill="#374151" font-family="Menlo, Consolas, monospace">make test</text><text x="542" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" opacity="0">等待<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.5;0.625" values="1;0;1;0"/></text><text x="542" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#a16207" opacity="0">⏳ 运行中<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.2;0.625;0.7;0.9;0.95" values="0;1;0;1;0;1;0"/></text><text x="542" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#166534" opacity="0">✓ passed<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.5;0.95" values="0;1;0;1"/></text><text x="542" y="198" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" opacity="0">✗ failed<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7;0.9" values="0;1;0"/></text>
<text x="485" y="240" text-anchor="middle" font-size="11" font-weight="400" fill="#1d4ed8" >stage 1: lint　→　stage 2: test</text>
<text x="485" y="256" text-anchor="middle" font-size="11" font-weight="400" fill="#1d4ed8" >两个 job 任一失败 = 流水线失败</text>
<rect x="650" y="150" width="110" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"><animate attributeName="fill" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.275;0.5;0.7;0.95" values="#f3f4f6;#fef9c3;#dcfce7;#f3f4f6;#fee2e2;#f3f4f6"/></rect>
<text x="705" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#111827" >同伴评审</text>
<text x="705" y="194" text-anchor="middle" font-size="11" fill="#6b7280" opacity="0">等待流水线<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.5;0.7;0.95" values="1;0;1;0;1"/></text>
<text x="705" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207" opacity="0">评审中…<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.275" values="0;1;0"/></text>
<text x="705" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" opacity="0">✓ Approved<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.275;0.5" values="0;1;0"/></text>
<text x="705" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b" opacity="0">🚫 Blocked<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7;0.95" values="0;1;0"/></text>
<rect x="790" y="150" width="90" height="60" rx="8" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"><animate attributeName="fill" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.35;0.45;0.5" values="#fef9c3;#fef9c3;#dcfce7;#fef9c3"/></rect>
<text x="835" y="172" text-anchor="middle" font-size="15" font-weight="700" fill="#111827" >main</text>
<text x="835" y="194" text-anchor="middle" font-size="11" fill="#6b7280" opacity="0">受保护分支<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.35;0.5" values="1;0;1"/></text>
<text x="835" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#a16207" opacity="0">⏳ 再跑一次<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.35;0.45" values="0;1;0"/></text>
<text x="835" y="194" text-anchor="middle" font-size="11" font-weight="700" fill="#166534" opacity="0">✓ main 绿<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.45;0.5" values="0;1;0"/></text>
<path id="p1" d="M150,180 L190,180" fill="none" stroke="#9ca3af" stroke-width="1.5"/><polygon points="182,175 190,180 182,185" fill="#9ca3af"/>
<path id="p2" d="M320,180 L360,180" fill="none" stroke="#9ca3af" stroke-width="1.5"/><polygon points="352,175 360,180 352,185" fill="#9ca3af"/>
<path id="p3" d="M610,180 L650,180" fill="none" stroke="#9ca3af" stroke-width="1.5"/><polygon points="642,175 650,180 642,185" fill="#9ca3af"/>
<path id="p4" d="M760,180 L790,180" fill="none" stroke="#9ca3af" stroke-width="1.5"/><polygon points="782,175 790,180 782,185" fill="#9ca3af"/>
<path id="pfix" d="M542,210 L542,300 L85,300 L85,210" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 4" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7;0.95" values="0;1;0"/></path>
<text x="313" y="292" text-anchor="middle" font-size="11" font-weight="700" fill="#dc2626" opacity="0">在同一分支上修复，再 push（流水线自动重跑）<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7;0.95" values="0;1;0"/></text>
<circle r="6" fill="#2563eb" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05" values="1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0;0.05;1"><mpath href="#p1"/></animateMotion></circle>
<circle r="6" fill="#2563eb" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.55" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.55;1"><mpath href="#p1"/></animateMotion></circle>
<circle r="6" fill="#2563eb" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.03;0.05" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.03;0.05;1"><mpath href="#p2"/></animateMotion></circle>
<circle r="6" fill="#2563eb" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.53;0.55" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.53;0.55;1"><mpath href="#p2"/></animateMotion></circle>
<circle r="6" fill="#2563eb" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.83;0.85" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.83;0.85;1"><mpath href="#p2"/></animateMotion></circle>
<circle r="6" fill="#16a34a" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.22" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.2;0.22;1"><mpath href="#p3"/></animateMotion></circle>
<circle r="6" fill="#16a34a" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.275;0.35" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.275;0.35;1"><mpath href="#p4"/></animateMotion></circle>
<circle r="6" fill="#dc2626" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.72;0.8" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.72;0.8;1"><mpath href="#pfix"/></animateMotion></circle>
<circle r="6" fill="#dc2626" opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8;0.83" values="0;1;0"/><animateMotion dur="20s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8;0.83;1"><mpath href="#p1"/></animateMotion></circle>
<g opacity="0"><animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7;0.95" values="0;1;0"/><rect x="610" y="92" width="270" height="34" rx="17" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="745" y="114" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b" >Merge blocked: pipeline must succeed</text></g>
<text x="30" y="70" text-anchor="start" font-size="13" font-weight="700" fill="#374151" opacity="0">第 1 轮：一切顺利<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="1;0"/></text>
<text x="30" y="70" text-anchor="start" font-size="13" font-weight="700" fill="#dc2626" opacity="0">第 2 轮：test 失败，MR 被挡住<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5" values="0;1"/></text>
<rect x="20" y="330" width="860" height="120" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
<text x="34" y="352" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280" >当前发生了什么</text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">① 开发者 push 到 feature 分支，开 merge request → GitLab 自动触发流水线<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05" values="1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">② stage 1：lint 检查代码风格（ruff / flake8）<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05;0.125" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">③ stage 2：pytest 跑自动化测试（lint 过了才轮到它）<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.125;0.2" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">④ 流水线全绿，评审者才开始看代码（人不必替机器找格式错误）<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;0.275" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">⑤ 评审通过 → 合并进 main<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.275;0.35" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">⑥ 推送到 main 也触发流水线：main 最新 commit 必须是绿的（报告截止时会查）<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.35;0.5" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">① 另一个 MR：push → 流水线开始，lint 通过<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.625" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">② test 阶段……<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.625;0.7" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">③ 测试失败 → 流水线失败 → MR 不能合并（Pipelines must succeed）；main 不受影响<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.7;0.8" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">④ 作者在同一分支修 bug 再 push，流水线自动重跑<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8;0.95" values="0;1;0"/></text>
<text x="450" y="395" text-anchor="middle" font-size="14" font-weight="700" fill="#111827" opacity="0">⑤ 变绿了，评审与合并才能继续。报告里要有"至少一次失败 + 怎么处理"的截图<animate attributeName="opacity" dur="20s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.95" values="0;1"/></text>
<text x="450" y="430" text-anchor="middle" font-size="11" font-weight="400" fill="#6b7280" >对应要求：定义在 .gitlab-ci.yml｜在 MR 和 main 上自动运行｜lint + 测试任一失败即失败｜main 最新 commit 必须通过</text>
</svg>